<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morgia Forms</title>
</head>

<body>
    <h1> Morgia Maron Flight Form</h1>
    <hr>
    <form action="results.html" method="get">
        <div class="choice-box">
            <b><big>1. Contact Information</big></b><br><br>
            <div class="choices">
                <label for="title">Title</label><br>
                <input type="text" id="title" name="title"><br>
            </div>
            <div class="choices">
                <label for="Wname">Whole Name:</label><br>
                <input type="text" id="Wname" name="Wname"><br>
            </div>
            <div class="choices">
                <label for="email">Enter your email:</label><br>
                <input type="email" id="email" name="email"><br>
            </div>
            <div class="choices">
                <label for="phone">Phone Number:</label><br>
                <input type="tel" id="phone" name="phone" pattern="\d{11}" maxlength="11" required><br>
            </div>
            <div class="choices">
                <label for="fax">Fax:</label><br>
                <input type="tel" id="fax" name="fax"><br>
            </div>
            <div class="choices">
                <label for="address">Street Address</label><br>
                <input type="text" id="address" name="address" style="width: 400px;"><br>
            </div>
        </div>

        <div class="choice-box">
            <b><big>2. When do you plan to travel next?</big></b><br>
            <div class="choices">
                <input type="radio" class="3mo" name="q2" value="1-3 Months">
                <label for="3mo">1-3 Months</label><br>
            </div>
            <div class="choices">
                <input type="radio" class="6mo" name="q2" value="3-6 Months">
                <label for="6mo">3-6 Months</label><br>
            </div>
            <div class="choices">
                <input type="radio" class="12mo" name="q2" value="6-12 Months">
                <label for="12mo">6-12 Months</label><br>
            </div>
            <div class="choices">
                <input type="radio" class="yr" name="q2" value="More than a year">
                <label for="yr">More than a year</label><br>
            </div>
        </div>

        <div class="choice-box">
            <b><big>3. How far in advance do you normally book your trips?</big></b><br>
            <div class="choices">
                <input type="radio" class="3mo" name="q3" value="1-3 Months">
                <label for="3mo">1-3 Months</label><br>
            </div>
            <div class="choices">
                <input type="radio" class="6mo" name="q3" value="3-6 Months">
                <label for="6mo">3-6 Months</label><br>
            </div>
            <div class="choices">
                <input type="radio" class="12mo" name="q3" value="6-12 Months">
                <label for="12mo">6-12 Months</label><br>
            </div>
            <div class="choices">
                <input type="radio" class="yr" name="q3" value="More than a year">
                <label for="yr">More than a year</label><br>
            </div>
        </div>

        <div class="choice-box">
            <b><big>4. What time of the year do you normally prefer to travel?</big></b><br>
            <div class="choices">
                <input type="checkbox" id="spring" name="q4" value="Spring">
                <label for="spring"> Spring </label><br>
            </div>
            <div class="choices">
                <input type="checkbox" id="summer" name="q4" value="Summer">
                <label for="summer"> Summer </label><br>
            </div>
            <div class="choices">
                <input type="checkbox" id="fall" name="q4" value="Fall">
                <label for="fall"> Fall </label><br>
            </div>
            <div class="choices">
                <input type="checkbox" id="winter" name="q4" value="Winter">
                <label for="winter"> Winter </label><br>
            </div>
        </div>

        <div class="choice-box">
            <b><big>5. What region of the world is your most favorite place to travel?</big></b><br>
            <div class="choices">
                <input type="checkbox" id="NorthAm" name="q5" value="North America">
                <label for="NorthAm"> North America </label><br>
            </div>
            <div class="choices">
                <input type="checkbox" id="SouthAm" name="q5" value="South America">
                <label for="SouthAm"> South America </label><br>
            </div>
            <div class="choices">
                <input type="checkbox" id="CentralAm" name="q5" value="Central America">
                <label for="CentralAm"> Central America </label><br>
            </div>
            <div class="choices">
                <input type="checkbox" id="Africa" name="q5" value="Africa">
                <label for="Africa"> Africa </label><br>
            </div>
            <div class="choices">
                <input type="checkbox" id="Europe" name="q5" value="Europe">
                <label for="Europe"> Europe </label><br>
            </div>
            <div class="choices">
                <input type="checkbox" id="MiddleEast" name="q5" value="Middle East">
                <label for="MiddleEast"> Middle East </label><br>
            </div>
            <div class="choices">
                <input type="checkbox" id="AsiaPacific" name="q5" value="Asia Pacific">
                <label for="AsiaPacific"> Asia Pacific </label><br>
            </div>
            <div class="choices">
                <input type="checkbox" id="Orient" name="q5" value="Orient">
                <label for="Orient"> Orient </label><br>
            </div>
            <div class="choices">
                <input type="checkbox" id="Other" name="q5" value="Other" onclick="toggleOtherInput(this)">
                <label for="Other"> Other </label>
                <input type="text" id="OtherText" name="otherText" style="display: none;" placeholder="Please specify"><br><br>
            </div>

            <script>
                function toggleOtherInput(checkbox) {
                    var input = document.getElementById("OtherText");
                    input.style.display = checkbox.checked ? "inline-block" : "none";
                }
            </script>
        </div>
    </form>
</body>

</html>
